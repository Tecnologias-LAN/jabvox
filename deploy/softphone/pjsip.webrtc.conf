; ============================================================================
; Jabvox Softphone — Configuración PJSIP para WebRTC (Asterisk 18+)
; ----------------------------------------------------------------------------
; Habilita registro y llamadas de softphones WebRTC (SIP sobre WSS + DTLS-SRTP + ICE).
; Incluye este archivo desde pjsip.conf:  #include pjsip.webrtc.conf
;
; Requisitos previos:
;   - Certificado TLS válido para el dominio del PBX (Let's Encrypt).
;   - res_pjsip, res_pjsip_transport_websocket, res_srtp cargados.
;   - Puerto 8089/tcp (WSS) abierto en el firewall.
; ============================================================================

; --- Transporte WSS (WebSocket seguro) ---
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089
cert_file = /etc/asterisk/keys/fullchain.pem
priv_key_file = /etc/asterisk/keys/privkey.pem
; La verificación de origen la hace el navegador; aquí solo terminamos TLS.

; --- Plantilla de endpoint WebRTC ---
; Cada extensión hereda de aquí. El "context" debe coincidir con default_context de
; JabvoxSoftphoneConfig (por defecto: from-webrtc).
[webrtc-endpoint](!)
type = endpoint
context = from-webrtc
disallow = all
allow = opus,ulaw,alaw          ; deben coincidir con los codecs de la config del panel
webrtc = yes                    ; activa DTLS-SRTP, ICE, rtcp-mux, bundle automáticamente
dtls_auto_generate_cert = yes
use_avpf = yes
media_encryption = dtls
rtcp_mux = yes
ice_support = yes
media_use_received_transport = yes
trust_id_inbound = yes
direct_media = no               ; el audio pasa por Asterisk (necesario tras NAT)

[webrtc-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

[webrtc-auth](!)
type = auth
auth_type = userpass

; ============================================================================
; EJEMPLO de una extensión (1001). En producción se genera una por cada
; JabvoxSoftphoneExtension. El username/secret deben coincidir con sip_username /
; sip_secret guardados (cifrados) en la extensión del panel Super Admin.
; ============================================================================
[1001](webrtc-endpoint)
auth = 1001-auth
aors = 1001

[1001-auth](webrtc-auth)
username = 1001
password = CAMBIA_ESTE_SECRETO      ; == sip_secret de la extensión en el panel

[1001](webrtc-aor)
