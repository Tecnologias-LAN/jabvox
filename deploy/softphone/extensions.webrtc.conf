; ============================================================================
; Jabvox Softphone — Dialplan del contexto WebRTC
; ----------------------------------------------------------------------------
; Contexto al que llegan las llamadas SALIENTES del softphone (context = from-webrtc).
; Incluye desde extensions.conf:  #include extensions.webrtc.conf
;
; Enruta:
;   - Llamadas internas entre extensiones (1000-1999).
;   - Llamadas externas a la troncal (ajusta el nombre de tu trunk).
;
; El DIALER y el CLICK-TO-CALL server-side siguen usando sus propios contextos por AMI;
; este contexto es solo para las llamadas que ORIGINA el softphone en el navegador.
; ============================================================================

[from-webrtc]
; --- Llamadas internas: otra extensión softphone/SIP ---
exten => _1XXX,1,NoOp(Softphone -> extensión interna ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; --- Llamadas externas por la troncal ---
; Cambia "mi-troncal" por el endpoint/registro de tu proveedor.
exten => _X.,1,NoOp(Softphone -> externo ${EXTEN})
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN}@mi-troncal,60)
 same => n,Hangup()
