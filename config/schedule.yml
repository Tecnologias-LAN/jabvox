# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed daily at 0000 UTC
# schedules daily deferred jobs at stable times for each installation
internal_check_new_versions_job:
  cron: '0 0 * * *'
  class: 'Internal::TriggerDailyScheduledItemsJob'
  queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping

# Jabvox Analytics: sweep expired durable query-cache rows hourly
jabvox_analytics_cache_sweeper_job:
  cron: '17 * * * *'
  class: 'Jabvox::Analytics::CacheSweeperJob'
  queue: scheduled_jobs

# Jabvox Analytics: prune audit logs older than the retention window, daily
jabvox_analytics_audit_retention_job:
  cron: '40 3 * * *'
  class: 'Jabvox::Analytics::AuditRetentionJob'
  queue: scheduled_jobs

# Jabvox Tasks: advance task cards with time-based stage automations, every 15 minutes
jabvox_task_time_automations_job:
  cron: '*/15 * * * *'
  class: 'Jabvox::TaskTimeAutomationsJob'
  queue: scheduled_jobs

# Jabvox Tasks: dispatch due recurring per-task automations (email/sms/message), hourly so a
# day/week/month schedule fires near its configured hour.
jabvox_task_automations_dispatch_job:
  cron: '0 * * * *'
  class: 'Jabvox::TaskAutomationsDispatchJob'
  queue: scheduled_jobs

# Safety net: purge any expired short-lived access tokens (e.g. Bulk WhatsApp) every 15
# minutes, in case a per-token cleanup job was missed. Never touches non-expiring tokens.
jabvox_expired_access_tokens_sweeper_job:
  cron: '*/15 * * * *'
  class: 'Jabvox::ExpiredAccessTokensSweeperJob'
  queue: scheduled_jobs

# executed daily at 2300 UTC — permanently purges trashed imported leads whose
# 30-day retention window has passed (restore is only possible before then).
jabvox_lead_import_purge_trash_job:
  cron: '0 23 * * *'
  class: 'Jabvox::LeadImport::PurgeTrashJob'
  queue: scheduled_jobs

# every 5 minutes — reconciles each account's external data-export DB with an
# incremental backfill (records changed since the last full sync), catching
# anything the real-time mirror missed. Low-priority queue + per-target lock keep
# it from saturating the server.
jabvox_external_export_reconcile_job:
  cron: '*/5 * * * *'
  class: 'Jabvox::ExternalExport::ReconcileSchedulerJob'
  queue: scheduled_jobs
