######  Captain Agent Tools Configuration #######
# id: Tool identifier used to resolve the class (Captain::Tools::{PascalCase(id)}Tool)
# title: Human-readable tool name for frontend display
# description: Brief description of what the tool does
# icon: Icon name for frontend display (frontend icon system)
#######################################################

- id: add_contact_note
  title: 'Add Contact Note'
  description: 'Add a note to a contact profile'
  icon: 'note-add'

- id: add_private_note
  title: 'Add Private Note'
  description: 'Add a private note to a conversation (internal only)'
  icon: 'eye-off'

- id: update_priority
  title: 'Update Priority'
  description: 'Update conversation priority level'
  icon: 'exclamation-triangle'

- id: add_label_to_conversation
  title: 'Add Label to Conversation'
  description: 'Add a label to a conversation'
  icon: 'tag'

- id: faq_lookup
  title: 'FAQ Lookup'
  description: 'Search FAQ responses using semantic similarity'
  icon: 'search'

- id: resolve_conversation
  title: 'Resolve Conversation'
  description: 'Resolve a conversation when the issue has been addressed'
  icon: 'checkmark'

- id: handoff
  title: 'Handoff to Human'
  description: 'Hand off the conversation to a human agent'
  icon: 'user-switch'

# --- Tools de agenda y tareas de Jabvox IA ---
# Nota: el id se usa para resolver la clase (id.classify => ClaseTool). Se usan
# ids en inglés/singular porque el inflector de Rails singulariza mal el español
# (p. ej. "agendar_cita" => "AgendarCitum"). Los textos visibles van en español.
- id: check_availability
  title: 'Consultar disponibilidad'
  description: 'Consulta los horarios libres de un agente para agendar una cita'
  icon: 'calendar'

- id: schedule_appointment
  title: 'Agendar cita'
  description: 'Agenda una cita en el calendario para el cliente de la conversación'
  icon: 'calendar-add'

- id: list_board
  title: 'Listar tableros de tareas'
  description: 'Lista los tableros de tareas y sus etapas disponibles'
  icon: 'board'

- id: create_task
  title: 'Crear tarea'
  description: 'Crea una tarea en un tablero, vinculada al cliente de la conversación'
  icon: 'task-add'
