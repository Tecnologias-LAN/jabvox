# Voice broadcast (marcación masiva de voz)
# Worker Sidekiq dedicado y AISLADO: procesa solo su(s) cola(s). Así una carga
# pesada en este servicio no puede taponar los mensajes ni otros servicios.
---
:verbose: false
:concurrency: <%= ENV.fetch("JABVOX_BROADCAST_CONCURRENCY", "3").to_i %>
:timeout: 25
:max_retries: 3
:queues:
  - jabvox_broadcast
