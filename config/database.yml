default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('POSTGRES_HOST', 'localhost') %>
  port: <%= ENV.fetch('POSTGRES_PORT', '5432') %>
  # Con pgbouncer en transaction mode hay que DESACTIVAR prepared statements (pgbouncer
  # no los soporta en ese modo y Rails fallaría con "prepared statement already exists").
  # Por defecto quedan activos (comportamiento actual); pon DB_PREPARED_STATEMENTS=false
  # en el .env el día que la app apunte a pgbouncer.
  prepared_statements: <%= ENV.fetch('DB_PREPARED_STATEMENTS', 'true') == 'true' %>
   # ref: https://github.com/mperham/sidekiq/issues/2985#issuecomment-531097962
  pool: <%= Sidekiq.server? ? ENV.fetch('SIDEKIQ_CONCURRENCY', 10) : ENV.fetch('RAILS_MAX_THREADS', 5) %>
  # frequency in seconds to periodically run the Reaper, which attempts
  # to find and recover connections from dead threads
  reaping_frequency: <%= ENV.fetch('DB_POOL_REAPING_FREQUENCY', 30) %>
  variables:
    # we are setting this value to be close to the racktimeout value. we will iterate and reduce this value going forward
    statement_timeout: <%= ENV["POSTGRES_STATEMENT_TIMEOUT"] || "14s" %>

development:
  <<: *default
  database: "<%= ENV.fetch('POSTGRES_DATABASE', 'jabvox_dev') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'postgres') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', '') %>"

test:
  <<: *default
  # IMPORTANTE (incidente oct-2026): NO heredar POSTGRES_DATABASE aquí. El .env de
  # desarrollo define POSTGRES_DATABASE=jabvox_dev; si el entorno de test lo leyera,
  # db:test:prepare purgaría la base de DESARROLLO. El test usa su propia variable
  # (POSTGRES_TEST_DATABASE) y, si no existe, SIEMPRE el literal 'jabvox_test'.
  database: "<%= ENV.fetch('POSTGRES_TEST_DATABASE', 'jabvox_test') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'postgres') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', '') %>"

production:
  <<: *default
  database: "<%= ENV.fetch('POSTGRES_DATABASE', 'jabvox_production') %>"
  username: "<%= ENV.fetch('POSTGRES_USERNAME', 'jabvox_prod') %>"
  password: "<%= ENV.fetch('POSTGRES_PASSWORD', 'jabvox_prod') %>"
