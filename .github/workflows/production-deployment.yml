name: Production Deployment

on:
  # 1. Run CI checks on every push to main (Feedback loop)
  push:
    branches: ["main", "develop"]

  # 2. Manual Trigger for Deployment (The "Click")
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type "yes" to confirm deployment to VM'
        required: true
        default: 'no'

permissions:
  contents: read

jobs:
  # JOB 1: CI Check (Builds Code)
  # Runs on every push AND every deployment attempt.
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Verify SDK Build
        run: pnpm build:sdk

  # JOB 2: Deploy to VM
  # ONLY runs if you clicked the button AND typed "yes"
  deploy:
    needs: ci-check
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deployment == 'yes' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script_stop: true
          script: |
            sudo -u jabvox bash -lc '
              set -e
              PROJECT_DIR="/home/jabvox/jabvox"
              BACKUP_DIR="$PROJECT_DIR/backups"
              cd "$PROJECT_DIR"

              # --- STEP 1: DATABASE BACKUP ---
              echo "Starting Database Backup..."
              mkdir -p "$BACKUP_DIR"

              set -a
              source <(grep -E "^(POSTGRES_|DATABASE_URL=)" .env)
              set +a

              FILE="backup_$(date +%Y%m%d_%H%M%S).sql"
              PGPASSWORD=$POSTGRES_PASSWORD pg_dump \
                -h ${POSTGRES_HOST:-127.0.0.1} \
                -p ${POSTGRES_PORT:-5432} \
                -U ${POSTGRES_USERNAME:-jabvox} \
                ${POSTGRES_DATABASE:-chatwoot_production} > "$BACKUP_DIR/$FILE"

              echo "Backup saved: $FILE"
              find "$BACKUP_DIR" -name "backup_*.sql" -mtime +7 -delete

              # --- STEP 2: UPDATE CODE ---
              echo "Pulling latest code..."
              git remote set-url origin git@github.com:Tecnologias-LAN/Jabvox-complete.git
              git fetch origin main
              git reset --hard origin/main

              # --- STEP 3: INSTALL DEPENDENCIES ---
              echo "Installing dependencies..."
              export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
              eval "$(rbenv init -)"
              # Ensure the lockfiles are writable by this user (a previous root-run
              # bundle can leave them owned by root -> "error writing Gemfile.lock").
              chmod u+w Gemfile.lock yarn.lock pnpm-lock.yaml 2>/dev/null || true
              bundle install
              pnpm install --no-frozen-lockfile --force

              # --- STEP 4: MIGRATIONS & ASSETS ---
              echo "Running DB migrations and assets precompile..."
              DISABLE_DATABASE_ENVIRONMENT_CHECK=1 RAILS_ENV=production bundle exec rake db:migrate
              RAILS_ENV=production bundle exec rake assets:precompile
            '

            # --- STEP 5: RESTART APPLICATION ---
            echo "Restarting services..."
            sudo -n /usr/bin/systemctl restart chatwoot-web.1.service
            sudo -n /usr/bin/systemctl restart chatwoot-worker.1.service
            # AMI listener (dialer + click-to-call live events). Restart so it
            # picks up new code; "|| true" keeps the deploy green if the unit
            # isn't installed on this host yet.
            sudo -n /usr/bin/systemctl restart chatwoot-ami-listener.service || true
            for s in 0 1 2 3 4 5 6 7; do
              sudo -n /usr/bin/systemctl restart chatwoot-ami-listener@$s.service || true
            done

            # Workers Sidekiq aislados por servicio (ver deploy/workers/README.md).
            # "|| true" para no romper el deploy en hosts donde aún no se instalaron.
            for w in export lead-import meta ami cdr media analytics broadcast click-to-call automations payments sms; do
              sudo -n /usr/bin/systemctl restart chatwoot-worker-$w.service || true
            done

            echo "Deployment Complete!"
