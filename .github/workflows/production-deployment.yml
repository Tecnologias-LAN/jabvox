name: Production Deployment

on:
  # 1. Run CI checks on every push to main (Feedback loop)
  push:
    branches: ["main", "develop"]

  # 2. Manual Trigger for Deployment (The "Click")
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type "yes" to confirm deployment to VM'
        required: true
        default: 'no'

permissions:
  contents: read

jobs:
  # JOB 1: CI Check (Builds Code)
  # Runs on every push AND every deployment attempt.
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Verify SDK Build
        run: pnpm build:sdk

  # JOB 2: Deploy to VM
  # ONLY runs if you clicked the button AND typed "yes"
  deploy:
    needs: ci-check
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deployment == 'yes' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script_stop: true
          # Sin PTY, `sudo -n systemctl restart ...` fallaba con "interactive
          # authentication is required"/"a password is required" pese a que la
          # regla NOPASSWD estaba bien (probado manualmente por SSH normal, que
          # sí asigna TTY, una y otra vez sin error) — ssh-action corre el script
          # dentro de un contenedor vía una librería SSH en Go que no pide
          # terminal a menos que se le indique explícitamente.
          request_pty: true
          script: |
            sudo -u jabvox bash -lc '
              set -e
              PROJECT_DIR="/home/jabvox/jabvox"
              BACKUP_DIR="$PROJECT_DIR/backups"
              cd "$PROJECT_DIR"

              # --- STEP 1: DATABASE BACKUP ---
              echo "Starting Database Backup..."
              mkdir -p "$BACKUP_DIR"

              set -a
              source <(grep -E "^(POSTGRES_|DATABASE_URL=)" .env)
              set +a

              FILE="backup_$(date +%Y%m%d_%H%M%S).sql"
              PGPASSWORD=$POSTGRES_PASSWORD pg_dump \
                -h ${POSTGRES_HOST:-127.0.0.1} \
                -p ${POSTGRES_PORT:-5432} \
                -U ${POSTGRES_USERNAME:-jabvox} \
                ${POSTGRES_DATABASE:-chatwoot_production} > "$BACKUP_DIR/$FILE"

              echo "Backup saved: $FILE"
              find "$BACKUP_DIR" -name "backup_*.sql" -mtime +7 -delete

              # --- STEP 2: UPDATE CODE ---
              echo "Pulling latest code..."
              git remote set-url origin git@github.com:Tecnologias-LAN/Jabvox-complete.git
              git fetch origin main
              git reset --hard origin/main

              # --- STEP 3: INSTALL DEPENDENCIES ---
              echo "Installing dependencies..."
              export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
              eval "$(rbenv init -)"
              # Ensure the lockfiles are writable by this user (a previous root-run
              # bundle can leave them owned by root -> "error writing Gemfile.lock").
              chmod u+w Gemfile.lock yarn.lock pnpm-lock.yaml 2>/dev/null || true
              bundle install
              pnpm install --no-frozen-lockfile --force

              # --- STEP 4: MIGRATIONS & ASSETS ---
              echo "Running DB migrations and assets precompile..."
              DISABLE_DATABASE_ENVIRONMENT_CHECK=1 RAILS_ENV=production bundle exec rake db:migrate
              RAILS_ENV=production bundle exec rake assets:precompile
            '

            # --- STEP 5: RESTART APPLICATION ---
            # Pendiente (ver conversación de deploy): desde esta acción `sudo -n
            # systemctl restart ...` falla con "interactive authentication is
            # required" aunque el mismo comando, mismo usuario, misma regla de
            # sudoers funciona bien probado a mano por SSH normal — causa aún sin
            # confirmar (request_pty no lo resolvió; el workflow real que corre
            # GitHub Actions se lee de la rama por defecto del repo, no de
            # Testing, así que hay que revisarlo ahí). Mientras tanto esto NO
            # interrumpe el deploy si el reinicio falla — solo avisa — para no
            # bloquear el pipeline por un problema ya conocido y en investigación.
            echo "Restarting services..."
            RESTART_FAILED=0

            restart_required() {
              # Servicio obligatorio: se avisa si no reinicia, pero no se aborta
              # el deploy (ver comentario arriba).
              sudo -n /usr/bin/systemctl restart "$1" || true
              if ! sudo -n /usr/bin/systemctl is-active --quiet "$1"; then
                echo "::warning::No se pudo reiniciar $1 (revisa sudoers en el host, o reinicia a mano)"
                RESTART_FAILED=1
              else
                echo "OK: $1 reiniciado"
              fi
            }

            restart_optional() {
              # Servicio opcional: puede no estar instalado en este host todavía.
              # Solo se avisa (no se falla el deploy) si systemctl lo reconoce
              # pero el reinicio no aplicó — eso sí sería un problema de permisos,
              # a diferencia de "unit not found" (no instalado, se ignora).
              sudo -n /usr/bin/systemctl restart "$1" 2>/dev/null || true
              if sudo -n /usr/bin/systemctl list-unit-files "$1" &>/dev/null \
                 && sudo -n /usr/bin/systemctl list-unit-files "$1" | grep -q "$1"; then
                if sudo -n /usr/bin/systemctl is-active --quiet "$1"; then
                  echo "OK: $1 reiniciado"
                else
                  echo "::warning::$1 está instalado pero no quedó activo tras el reinicio"
                fi
              fi
            }

            restart_required chatwoot-web.1.service
            restart_required chatwoot-worker.1.service

            # AMI listener (dialer + click-to-call live events).
            restart_optional chatwoot-ami-listener.service
            for s in 0 1 2 3 4 5 6 7; do
              restart_optional "chatwoot-ami-listener@$s.service"
            done

            # Workers Sidekiq aislados por servicio (ver deploy/workers/README.md).
            for w in export lead-import meta ami cdr media analytics broadcast click-to-call automations payments sms; do
              restart_optional "chatwoot-worker-$w.service"
            done

            if [ "$RESTART_FAILED" -eq 1 ]; then
              echo "::warning::El deploy actualizó el código pero algún servicio obligatorio no se reinició — revisar y reiniciar a mano si hace falta."
            fi

            echo "Deployment Complete!"
